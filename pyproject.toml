[project]
name = "llm-firewall-sandbox"
version = "0.1.0"
description = "An interactive security proxy that intercepts, sanitizes, and evaluates prompts before they reach a local LLM, with vector-similarity attack detection and a honeypot sandbox."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pandas>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
